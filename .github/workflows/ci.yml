name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/estrutura-inicial]

permissions:
  contents: read

jobs:
  validate:
    name: Lint, tipos e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Verificar TypeScript
        run: npx tsc --noEmit
      - name: Build de produção
        run: npm run build
